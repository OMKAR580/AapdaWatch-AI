services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 with PostGIS 3.4 Geospatial Extensions
  # ---------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: aapdawatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aapdawatch_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aapdawatch_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-aapdawatch_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - aapdawatch_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aapdawatch_admin} -d ${POSTGRES_DB:-aapdawatch_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aapdawatch-net

  # ---------------------------------------------------------------------------
  # Backend NestJS API Container
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    container_name: aapdawatch-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-aapdawatch_admin}:${POSTGRES_PASSWORD:-aapdawatch_secure_pass}@postgres:5432/${POSTGRES_DB:-aapdawatch_db}?schema=public
      FRONTEND_ORIGIN: http://localhost:3000
      LOG_LEVEL: debug
    ports:
      - "3001:3001"
    volumes:
      - ./backend/api:/app/backend/api
      - /app/backend/api/node_modules
    networks:
      - aapdawatch-net

volumes:
  aapdawatch_postgres_data:
    name: aapdawatch_postgres_data

networks:
  aapdawatch-net:
    name: aapdawatch-net
