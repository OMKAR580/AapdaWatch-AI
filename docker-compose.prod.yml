version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 + PostGIS 3.4 Spatial Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: aapdawatch-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aapdawatch_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aapdawatch_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-aapdawatch_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aapdawatch_admin} -d ${POSTGRES_DB:-aapdawatch_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aapdawatch-prod-net

  # ---------------------------------------------------------------------------
  # 2. Python FastAPI ML & Hugging Face Multilingual Inference Service
  # ---------------------------------------------------------------------------
  ml-service:
    build:
      context: ./backend/ml-service
      dockerfile: Dockerfile
    container_name: aapdawatch-ml-prod
    restart: always
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - KERAS_BACKEND=torch
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aapdawatch-prod-net

  # ---------------------------------------------------------------------------
  # 3. Next.js 16 Production Web Application & Glass Dashboard
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aapdawatch-frontend-prod
    restart: always
    depends_on:
      - ml-service
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_ML_SERVICE_URL=http://ml-service:8001/predict
      - NEXT_PUBLIC_WS_URL=ws://localhost:8001/ws/live-feed
    networks:
      - aapdawatch-prod-net

volumes:
  postgres_prod_data:
    name: aapdawatch_postgres_prod_data

networks:
  aapdawatch-prod-net:
    name: aapdawatch-prod-net

